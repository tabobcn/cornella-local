  CARDS.forEach((c, i) => {
    const on = t > c.t0 && t < c.t1 + 0.05; c.el.style.display = on ? 'flex' : 'none'; if (!on) return;
    const p = seg(t, c.t0, c.t0 + 0.55), out = eio(seg(t, c.t1 - 0.35, c.t1));
    const [x, y] = project(P0.g, c.a);
    const w = c.el.offsetWidth, hh = c.el.offsetHeight;
    let left = c.al === 'r' ? x - w : x; // 'r' = la tarjeta queda a la izquierda del punto
    left = clamp(left, 36, W - 36 - w);
    const s = lerp(0.72, 1, eback(p)) * (1 - 0.06 * out);
    const by = 7 * Math.sin(t * 1.4 + i);
    c.el.style.transform = `translate(${left.toFixed(1)}px, ${(y - hh / 2 + by - out * 16).toFixed(1)}px) scale(${s.toFixed(4)})`;
    c.el.style.opacity = (clamp(p * 2) * (1 - out)).toFixed(3);
  });
  // cierre
  const eo = seg(t, 38.9, 39.8);
  end.style.opacity = ss(eo).toFixed(3); end.style.display = eo > 0 ? 'flex' : 'none';
  endParts.forEach((el, i) => {
    const p = eout(seg(t, 39.3 + i * 0.16, 39.3 + i * 0.16 + 0.7));
    const sc = i === 0 ? lerp(0.6, 1, eback(seg(t, 39.3, 40.0))) : 1;
    el.style.transform = `translateY(${((1 - p) * 40).toFixed(1)}px) scale(${sc.toFixed(4)})`;
    el.style.opacity = p.toFixed(3);
  });
  return true;
};
window.DUR = 43.5;

window.draw(0);
window.ready = true;
</script>
