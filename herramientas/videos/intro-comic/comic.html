<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fffbeb; }
  body { font-family: 'Comic Neue', 'Inter', sans-serif; position: relative; }
  .slot { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 50%; }
  .bg { position: absolute; inset: 0; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(15,23,42,.13) 3px, transparent 3.5px); background-size: 26px 26px; }
  .panel { position: absolute; border: 9px solid #0f172a; border-radius: 10px; overflow: hidden; box-shadow: 14px 14px 0 #0f172a; background: #fff; }
  .panel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cap { position: absolute; background: #fde047; border: 7px solid #0f172a; box-shadow: 8px 8px 0 #0f172a; padding: 14px 26px 10px;
         font-family: 'Bangers', sans-serif; font-size: 58px; letter-spacing: 1.5px; line-height: 1.02; color: #0f172a; text-transform: uppercase; }
  .bub { position: absolute; background: #fff; border: 6px solid #0f172a; border-radius: 46px; padding: 22px 30px; font-weight: 700; font-size: 44px;
         line-height: 1.15; color: #0f172a; box-shadow: 6px 6px 0 rgba(15,23,42,.25); }
  .bub svg { position: absolute; overflow: visible; }
  .ono { position: absolute; font-family: 'Bangers', sans-serif; color: #fde047; -webkit-text-stroke: 5px #0f172a; paint-order: stroke fill;
         text-shadow: 6px 6px 0 #0f172a; letter-spacing: 2px; white-space: nowrap; }
  .burst { position: absolute; }
  .burst svg { position: absolute; inset: 0; overflow: visible; }
  .burst span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
                font-family: 'Bangers', sans-serif; color: #0f172a; line-height: 1; letter-spacing: 1px; }
  .phone { position: absolute; border-radius: 54px; background: #0f172a; border: 6px solid #0f172a; box-shadow: 12px 12px 0 rgba(15,23,42,.9); overflow: hidden; }
  .phone img { position: absolute; left: 12px; top: 12px; border-radius: 42px; }
  .stamp { position: absolute; font-family: 'Bangers', sans-serif; border: 8px solid; border-radius: 16px; padding: 6px 22px 2px; letter-spacing: 2px; white-space: nowrap; }
  .logo-card { position: absolute; background: #fff; border: 9px solid #0f172a; border-radius: 30px; box-shadow: 16px 16px 0 #0f172a; display: flex; align-items: center; justify-content: center; }
  .url { position: absolute; left: 50%; padding: 0 50px; height: 112px; line-height: 116px; border-radius: 56px; background: #4b71c3; color: #fff;
         font-family: 'Bangers', sans-serif; font-size: 68px; letter-spacing: 2px; white-space: nowrap; border: 7px solid #0f172a; box-shadow: 10px 10px 0 #0f172a; }
  .conf { position: absolute; border-radius: 3px; }
  .sub { position: absolute; left: 70px; right: 70px; text-align: center; font-weight: 700; color: #0f172a; font-size: 44px; line-height: 1.2; }
</style></head>
<body>
<div id="prev" class="slot"></div>
<div id="cur" class="slot"></div>
<script>
const INK = '#0f172a', YEL = '#fde047', BLUE = '#4b71c3', SKIN = '#f3c7a1', HAIR = '#3f2a1e', SWEATER = '#e85d4a';
const c01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = c01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = (x) => { const c1 = 1.7, c3 = c1 + 1; x = c01(x); return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - c01(x), 3);
const pop = (t, t0, d = 0.4) => outBack((t - t0) / d);
const fade = (t, t0, d = 0.25) => c01((t - t0) / d);
function rand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------- piezas de cómic ----------
function panel({ x, y, w, h, rot = 0, bg = '#fff', t, t0 = 0, from = 'scale', inner = '' }) {
  const k = pop(t, t0, 0.5), a = fade(t, t0, 0.15);
  let tr = `rotate(${rot}deg)`;
  if (from === 'scale') tr = `scale(${0.6 + 0.4 * k}) rotate(${rot + (1 - k) * 6}deg)`;
  if (from === 'left') tr = `translateX(${(1 - outCubic((t - t0) / 0.5)) * -1200}px) rotate(${rot}deg)`;
  if (from === 'right') tr = `translateX(${(1 - outCubic((t - t0) / 0.5)) * 1200}px) rotate(${rot}deg)`;
  if (from === 'down') tr = `translateY(${(1 - outCubic((t - t0) / 0.5)) * 1400}px) rotate(${rot}deg)`;
  return `<div class="panel" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg};opacity:${a};transform:${tr}">${inner}</div>`;
}
function caption({ x, y, text, t, t0, rot = -2, size = 58, w, bg = YEL, color = INK }) {
  const k = pop(t, t0, 0.4);
  if (t < t0) return '';
  return `<div class="cap" style="left:${x}px;top:${y}px;${w ? `width:${w}px;` : ''}font-size:${size}px;background:${bg};color:${color};opacity:${fade(t, t0, .12)};transform:rotate(${rot}deg) scale(${0.5 + 0.5 * k})">${text}</div>`;
}
// bocadillo con cola; typing: el texto aparece letra a letra
function bubble({ x, y, w, text, t, t0, tail = 'down-left', size = 44, typing = true, thought = false }) {
  if (t < t0) return '';
  const k = pop(t, t0, 0.35);
  const n = typing ? Math.floor(c01((t - t0 - 0.15) / Math.max(0.4, text.length * 0.035)) * text.length) : text.length;
  const shown = text.slice(0, n), hidden = text.slice(n);
  const tails = {
    'down-left': `<svg style="left:60px;bottom:-58px" width="80" height="62"><path d="M4 0 L30 56 L60 0" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="0" y="-8" width="66" height="12" fill="#fff"/></svg>`,
    'down-right': `<svg style="right:60px;bottom:-58px" width="80" height="62"><path d="M20 0 L50 56 L76 0" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="14" y="-8" width="66" height="12" fill="#fff"/></svg>`,
    'up-left': `<svg style="left:70px;top:-58px" width="80" height="62"><path d="M4 62 L24 6 L60 62" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="0" y="58" width="66" height="12" fill="#fff"/></svg>`,
    'left': `<svg style="left:-58px;top:40px" width="62" height="80"><path d="M62 6 L4 30 L62 56" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="58" y="0" width="12" height="66" fill="#fff"/></svg>`,
  };
  const cloud = thought ? `<svg style="left:40px;bottom:-90px" width="120" height="100"><circle cx="40" cy="22" r="16" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="20" cy="62" r="10" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="8" cy="88" r="6" fill="#fff" stroke="${INK}" stroke-width="4"/></svg>` : tails[tail];
  return `<div class="bub" style="left:${x}px;top:${y}px;width:${w}px;font-size:${size}px;${thought ? 'border-radius:70px;' : ''}transform-origin:20% 100%;transform:scale(${0.4 + 0.6 * k})">${cloud}<span style="position:relative">${shown}<span style="opacity:0">${hidden}</span></span></div>`;
}
function ono({ x, y, text, t, t0, size = 110, rot = -8, color = YEL, dur = 0.9 }) {
  if (t < t0 || t > t0 + dur + 0.3) return '';
  const k = pop(t, t0, 0.3), out = c01((t0 + dur + 0.3 - t) / 0.3);
  return `<div class="ono" style="left:${x}px;top:${y}px;font-size:${size}px;color:${color};opacity:${out};transform:translate(-50%,-50%) rotate(${rot}deg) scale(${0.3 + 0.7 * k})">${text}</div>`;
}
function burstSVG(r, n, inner, color) {
  let d = '';
  for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2; const rr = i % 2 ? r * inner : r; d += (i ? 'L' : 'M') + (r + Math.cos(a) * rr).toFixed(1) + ' ' + (r + Math.sin(a) * rr).toFixed(1) + ' '; }
  return `<path d="${d}Z" fill="${color}" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>`;
}
function burst({ cx, cy, r, text, size, t, t0, color = YEL, n = 14, spin = 0 }) {
  if (t < t0) return '';
  const k = pop(t, t0, 0.45);
  return `<div class="burst" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;transform:scale(${k}) rotate(${spin}deg)"><svg width="${2 * r}" height="${2 * r}">${burstSVG(r, n, 0.78, color)}</svg><span style="font-size:${size}px;transform:rotate(${-spin}deg)">${text}</span></div>`;
}
function rays(cx, cy, color, t, n = 18) {
  let d = '';
  for (let i = 0; i < n; i++) { const a0 = (i / n) * Math.PI * 2 + t * 0.15, a1 = a0 + Math.PI / n; d += `M${cx} ${cy} L${cx + Math.cos(a0) * 2400} ${cy + Math.sin(a0) * 2400} L${cx + Math.cos(a1) * 2400} ${cy + Math.sin(a1) * 2400}Z `; }
  return `<svg class="bg" width="1080" height="1920"><path d="${d}" fill="${color}"/></svg>`;
}
function qmark(x, y, t, t0, size = 90) {
  if (t < t0) return '';
  const k = pop(t, t0, 0.35); const bob = Math.sin((t - t0) * 5) * 8;
  return `<div class="ono" style="left:${x}px;top:${y + bob}px;font-size:${size}px;color:#fff;transform:translate(-50%,-50%) scale(${k}) rotate(${Math.sin(t * 3 + x) * 8}deg)">?</div>`;
}

// ---------- la vecina ----------
function person({ x, y, s = 1, expr = 'worried', phone = false, t = 0, look = 0, walk = 0, wave = false }) {
  const blink = (Math.abs(((t + x * 0.001) % 2.6) - 2.45) < 0.09) ? 0.15 : 1;
  const bob = walk ? Math.abs(Math.sin(t * 9)) * -10 : Math.sin(t * 2.2) * 3;
  const mouths = {
    worried: `<path d="M-26 146 Q0 128 26 146" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`,
    happy: `<path d="M-34 128 Q0 172 34 128 Z" fill="#b91c1c" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`,
    surprised: `<ellipse cx="0" cy="142" rx="15" ry="20" fill="#7f1d1d" stroke="${INK}" stroke-width="6"/>`,
    annoyed: `<path d="M-24 144 L24 138" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`,
  };
  const brows = {
    worried: `<path d="M-56 58 L-18 48 M18 48 L56 58" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`,
    happy: `<path d="M-54 52 Q-36 40 -16 50 M16 50 Q36 40 54 52" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`,
    surprised: `<path d="M-54 40 Q-36 28 -16 38 M16 38 Q36 28 54 40" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`,
    annoyed: `<path d="M-56 46 L-18 58 M18 58 L56 46" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`,
  };
  const lk = look * 8;
  const legs = walk ? `<g stroke="${INK}" stroke-width="30" stroke-linecap="round"><path d="M-40 360 L${-40 + Math.sin(t * 9) * 30} 470"/><path d="M40 360 L${40 - Math.sin(t * 9) * 30} 470"/></g>
    <g stroke="#334155" stroke-width="18" stroke-linecap="round"><path d="M-40 360 L${-40 + Math.sin(t * 9) * 30} 470"/><path d="M40 360 L${40 - Math.sin(t * 9) * 30} 470"/></g>` : '';
  const wa = Math.sin(t * 7) * 18;
  const arm = wave
    ? `<g transform="rotate(${wa} 90 240)"><path d="M90 240 Q170 200 170 90" fill="none" stroke="${INK}" stroke-width="44" stroke-linecap="round"/><path d="M90 240 Q170 200 170 90" fill="none" stroke="${SWEATER}" stroke-width="30" stroke-linecap="round"/>
       <circle cx="170" cy="78" r="26" fill="${SKIN}" stroke="${INK}" stroke-width="6"/></g>`
    : phone
    ? `<path d="M80 250 Q150 210 128 150" fill="none" stroke="${INK}" stroke-width="44" stroke-linecap="round"/><path d="M80 250 Q150 210 128 150" fill="none" stroke="${SWEATER}" stroke-width="30" stroke-linecap="round"/>
       <g transform="rotate(-8 130 120)"><rect x="100" y="60" width="66" height="116" rx="12" fill="#1e293b" stroke="${INK}" stroke-width="6"/><rect x="108" y="70" width="50" height="88" rx="6" fill="#93c5fd"/>
       <rect x="114" y="80" width="38" height="8" rx="3" fill="#fff" opacity=".8"/><rect x="114" y="96" width="30" height="8" rx="3" fill="#fff" opacity=".6"/></g>
       <circle cx="128" cy="150" r="20" fill="${SKIN}" stroke="${INK}" stroke-width="6"/>`
    : `<path d="M90 250 Q140 300 120 360" fill="none" stroke="${INK}" stroke-width="44" stroke-linecap="round"/><path d="M90 250 Q140 300 120 360" fill="none" stroke="${SWEATER}" stroke-width="30" stroke-linecap="round"/>`;
  return `<g transform="translate(${x} ${y + bob}) scale(${s})">
    ${legs}
    <path d="M-118 380 Q-122 214 0 200 Q122 214 118 380 Z" fill="${SWEATER}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-90 250 Q-140 300 -120 360" fill="none" stroke="${INK}" stroke-width="44" stroke-linecap="round"/><path d="M-90 250 Q-140 300 -120 360" fill="none" stroke="${SWEATER}" stroke-width="30" stroke-linecap="round"/>
    <rect x="-24" y="160" width="48" height="50" fill="${SKIN}" stroke="${INK}" stroke-width="7"/>
    <circle cx="0" cy="-26" r="40" fill="${HAIR}" stroke="${INK}" stroke-width="7"/>
    <ellipse cx="0" cy="92" rx="90" ry="98" fill="${SKIN}" stroke="${INK}" stroke-width="7"/>
    <path d="M-94 104 Q-104 -18 0 -12 Q104 -18 94 104 Q86 34 34 22 Q-30 46 -94 104Z" fill="${HAIR}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
    ${brows[expr]}
    <ellipse cx="${-32 + lk}" cy="96" rx="10" ry="${13 * blink}" fill="${INK}"/><ellipse cx="${32 + lk}" cy="96" rx="10" ry="${13 * blink}" fill="${INK}"/>
    <circle cx="-56" cy="126" r="13" fill="#f9a8a8" opacity=".7"/><circle cx="56" cy="126" r="13" fill="#f9a8a8" opacity=".7"/>
    ${mouths[expr]}
    ${arm}
  </g>`;
}

// ---------- escenarios ----------
function kitchen(t) {
  // fuga debajo del fregadero: gotas que caen, charco que crece
  let h = `<svg viewBox="0 0 960 620"><rect width="960" height="620" fill="#dbeafe"/>`;
  for (let i = 0; i < 12; i++) for (let j = 0; j < 4; j++) h += `<rect x="${i * 80 + (j % 2) * 40 - 40}" y="${j * 60}" width="80" height="60" fill="none" stroke="#bfdbfe" stroke-width="4"/>`;
  h += `<rect y="240" width="960" height="30" fill="#a16207" stroke="${INK}" stroke-width="6"/>
    <path d="M330 240 L350 300 L610 300 L630 240" fill="#e2e8f0" stroke="${INK}" stroke-width="6"/>
    <path d="M470 240 L470 150 Q470 120 510 120 L540 120" fill="none" stroke="#94a3b8" stroke-width="22" stroke-linecap="round"/><path d="M470 240 L470 150 Q470 120 510 120 L540 120" fill="none" stroke="${INK}" stroke-width="5" opacity=".35"/>
    <rect x="80" y="270" width="800" height="300" fill="#fef3c7" stroke="${INK}" stroke-width="6"/>
    <rect x="300" y="290" width="360" height="270" fill="#1e293b" stroke="${INK}" stroke-width="6"/>
    <rect x="96" y="290" width="190" height="270" rx="6" fill="#fde68a" stroke="${INK}" stroke-width="6"/><rect x="674" y="290" width="190" height="270" rx="6" fill="#fde68a" stroke="${INK}" stroke-width="6"/>
    <path d="M300 290 L250 280 L250 570 L300 560Z" fill="#fde68a" stroke="${INK}" stroke-width="6"/>
    <path d="M480 300 L480 400 Q480 430 510 430 L560 430 L560 560" fill="none" stroke="#cbd5e1" stroke-width="26"/><path d="M480 300 L480 400 Q480 430 510 430 L560 430 L560 560" fill="none" stroke="${INK}" stroke-width="5" opacity=".4"/>
    <rect y="570" width="960" height="50" fill="#e7e5e4" stroke="${INK}" stroke-width="6"/>`;
  // grieta y chorritos
  h += `<path d="M500 430 l10 -8 l6 10 l10 -6" stroke="${INK}" stroke-width="4" fill="none"/>`;
  for (let k = 0; k < 6; k++) {
    const ph = ((t * 1.25 + k / 6) % 1);
    const yy = 440 + ph * ph * 140; const xx = 515 + Math.sin(k * 2) * 10;
    h += `<path d="M${xx} ${yy - 14} Q${xx + 9} ${yy + 2} ${xx} ${yy + 8} Q${xx - 9} ${yy + 2} ${xx} ${yy - 14}Z" fill="#3b82f6" stroke="${INK}" stroke-width="3"/>`;
  }
  const pr = 40 + Math.min(1, t / 4) * 260;
  h += `<ellipse cx="520" cy="590" rx="${pr}" ry="${pr * 0.12 + 6}" fill="#60a5fa" stroke="${INK}" stroke-width="4" opacity=".9"/>`;
  // salpicones
  for (let k = 0; k < 3; k++) { const ph = (t * 1.25 + k / 3) % 1; if (ph < 0.25) { const r = ph * 120; h += `<ellipse cx="515" cy="585" rx="${r}" ry="${r * 0.25}" fill="none" stroke="#1d4ed8" stroke-width="4" opacity="${1 - ph * 4}"/>`; } }
  return h + `</svg>`;
}
function wallScene(t) {
  // pared con desconchones y un rodillo
  const roll = (Math.sin(t * 2.4) + 1) / 2;
  return `<svg viewBox="0 0 960 700"><rect width="960" height="700" fill="#e7e5e4"/>
    <path d="M120 120 l60 20 l-20 50 l50 30 l-70 10 z M640 380 l80 -10 l10 60 l-60 30 z M300 470 l50 10 l-10 40 l-60 -10z" fill="#d6d3d1" stroke="${INK}" stroke-width="4"/>
    <rect x="560" y="80" width="${300}" height="${200 + roll * 160}" fill="#bfdbfe" opacity=".95"/>
    <g transform="translate(${700} ${270 + roll * 160})"><rect x="-90" y="-26" width="180" height="52" rx="22" fill="#60a5fa" stroke="${INK}" stroke-width="6"/>
      <path d="M90 0 L120 0 L120 70 L20 70 L20 200" fill="none" stroke="${INK}" stroke-width="10"/><rect x="6" y="190" width="28" height="90" rx="10" fill="#f59e0b" stroke="${INK}" stroke-width="6"/></g></svg>`;
}
function street(t) {
  const shops = [['FORN', '#c0532f'], ['CAFÈ', '#0f766e'], ['FLORS', '#a21caf']];
  let h = `<svg viewBox="0 0 960 760"><rect width="960" height="760" fill="#bae6fd"/><circle cx="820" cy="110" r="60" fill="#fde047" stroke="${INK}" stroke-width="6"/>`;
  shops.forEach(([n, c], i) => {
    const x = 30 + i * 310;
    h += `<rect x="${x}" y="150" width="290" height="440" fill="${['#fde68a', '#ccfbf1', '#fae8ff'][i]}" stroke="${INK}" stroke-width="6"/>
      <rect x="${x + 30}" y="190" width="230" height="60" rx="8" fill="${INK}"/><text x="${x + 145}" y="236" text-anchor="middle" font-family="Bangers" font-size="44" fill="#fff" letter-spacing="3">${n}</text>`;
    for (let k = 0; k < 6; k++) h += `<path d="M${x + 10 + k * 45} 270 h45 v40 q-22 22 -45 0z" fill="${k % 2 ? '#fff' : c}" stroke="${INK}" stroke-width="5"/>`;
    h += `<rect x="${x + 20}" y="340" width="150" height="160" fill="#e0f2fe" stroke="${INK}" stroke-width="6"/><rect x="${x + 190}" y="340" width="80" height="250" fill="#78350f" stroke="${INK}" stroke-width="6"/>`;
  });
  h += `<rect y="590" width="960" height="170" fill="#d6d3d1" stroke="${INK}" stroke-width="6"/>`;
  return h + `</svg>`;
}
function shopWindow(t) {
  const sw = Math.sin(t * 3.2) * 6, ended = t > 2.7;
  const hand = t * 4;
  return `<svg viewBox="0 0 960 700"><rect width="960" height="700" fill="#fecaca"/>
    <rect x="60" y="60" width="840" height="560" fill="#fff7ed" stroke="${INK}" stroke-width="8"/>
    <rect x="100" y="100" width="560" height="480" fill="#e0f2fe" stroke="${INK}" stroke-width="6"/>
    <path d="M100 100 L260 100 L100 300Z" fill="#fff" opacity=".6"/>
    <g transform="rotate(${sw} 380 140)"><path d="M300 100 L380 160 L460 100" fill="none" stroke="${INK}" stroke-width="5"/>
      <rect x="230" y="160" width="300" height="190" rx="14" fill="${ended ? '#e5e7eb' : '#ef4444'}" stroke="${INK}" stroke-width="7"/>
      <text x="380" y="235" text-anchor="middle" font-family="Bangers" font-size="62" fill="#fff" letter-spacing="3">OFERTA</text>
      <text x="380" y="320" text-anchor="middle" font-family="Bangers" font-size="84" fill="#fff">-20%</text></g>
    <g transform="translate(780 200)"><circle r="90" fill="#fff" stroke="${INK}" stroke-width="8"/><line x1="0" y1="0" x2="${Math.cos(hand) * 60}" y2="${Math.sin(hand) * 60}" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="${Math.cos(hand / 12) * 40}" y2="${Math.sin(hand / 12) * 40}" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><circle r="8" fill="${INK}"/></g>
    <rect x="690" y="330" width="180" height="290" fill="#78350f" stroke="${INK}" stroke-width="6"/></svg>`;
}
function bigChains(t) {
  // un móvil con resultados de búsqueda: las grandes cadenas tapan a la tienda del barrio
  const rows = [['MEGASTORE', '#ef4444'], ['HIPER XXL', '#f59e0b'], ['TODO-ONLINE.COM', '#8b5cf6'], ['MEGASTORE', '#ef4444']];
  let h = `<svg viewBox="0 0 960 760"><rect width="960" height="760" fill="#e0e7ff"/>
    <rect x="250" y="40" width="460" height="700" rx="50" fill="${INK}"/><rect x="270" y="60" width="420" height="660" rx="36" fill="#f8fafc"/>
    <rect x="292" y="90" width="376" height="56" rx="28" fill="#e2e8f0" stroke="${INK}" stroke-width="4"/><text x="320" y="128" font-family="Comic Neue" font-weight="700" font-size="28" fill="#475569">tiendas cerca de mí</text>`;
  rows.forEach(([n, c], i) => {
    const k = outBack((t - 0.6 - i * 0.45) / 0.35); if (k <= 0) return;
    const y = 170 + i * 118;
    h += `<g transform="translate(480 ${y + 50}) scale(${k}) translate(-480 ${-(y + 50)})"><rect x="292" y="${y}" width="376" height="100" rx="16" fill="${c}" stroke="${INK}" stroke-width="5"/>
      <text x="480" y="${y + 64}" text-anchor="middle" font-family="Bangers" font-size="44" fill="#fff" letter-spacing="2">${n}</text></g>`;
  });
  // la tienda de barrio, empujada hacia abajo y cada vez más pequeña
  const push = c01((t - 0.6) / 2.0); const ty = 180 + push * 470, sc = 1 - push * 0.55;
  h += `<g transform="translate(480 ${ty + 40}) scale(${sc}) translate(-480 -40)"><rect x="320" y="0" width="320" height="80" rx="14" fill="#fff" stroke="${INK}" stroke-width="5"/>
    <text x="480" y="52" text-anchor="middle" font-family="Comic Neue" font-weight="700" font-size="30" fill="${INK}">Tienda del barrio</text></g>`;
  return h + `</svg>`;
}
function skyline(t, rise) {
  const r = rand(3); let h = '';
  for (let i = 0; i < 14; i++) {
    const w = 60 + r() * 60, hh = 160 + r() * 280, x = i * 80 - 20;
    h += `<rect x="${x}" y="${1920 - hh * rise}" width="${w}" height="${hh}" fill="#1e3a8a" stroke="${INK}" stroke-width="6"/>`;
    for (let j = 0; j < 4; j++) h += `<rect x="${x + 14}" y="${1920 - hh * rise + 30 + j * 50}" width="14" height="20" fill="${r() > 0.4 ? '#fde047' : '#334155'}"/><rect x="${x + 38}" y="${1920 - hh * rise + 30 + j * 50}" width="14" height="20" fill="${r() > 0.5 ? '#fde047' : '#334155'}"/>`;
  }
  return `<svg class="bg" width="1080" height="1920">${h}</svg>`;
}
function phoneShot(src, { x, y, w, t, t0, rot = 0 }) {
  if (t < t0) return '';
  const k = pop(t, t0, 0.5), h = w * 844 / 390;
  return `<div class="phone" style="left:${x}px;top:${y}px;width:${w + 24}px;height:${h + 24}px;transform:rotate(${rot + (1 - k) * 12}deg) scale(${0.5 + 0.5 * k});opacity:${fade(t, t0, .15)}"><img src="${src}" style="width:${w}px;height:${h}px"></div>`;
}
function stamp({ x, y, text, t, t0, color = '#16a34a', size = 74, rot = -10 }) {
  if (t < t0) return '';
  const k = c01((t - t0) / 0.18); const sc = 2.4 - 1.4 * k;
  return `<div class="stamp" style="left:${x}px;top:${y}px;font-size:${size}px;color:${color};border-color:${color};background:rgba(255,255,255,.85);opacity:${k};transform:translate(-50%,-50%) rotate(${rot}deg) scale(${sc})">${text}</div>`;
}
function confetti(t, t0, n = 120) {
  const k = t - t0; if (k < 0 || k > 3) return '';
  const r = rand(5); const cols = [BLUE, '#16a34a', '#f59e0b', '#e11d48', '#0ea5e9', '#a855f7', YEL];
  let h = '';
  for (let i = 0; i < n; i++) {
    const x0 = 540 + (r() - .5) * 200, vx = (r() - .5) * 1700, vy = -900 - r() * 900, g = 1500;
    const x = x0 + vx * k * .8, y = 1000 + vy * k + .5 * g * k * k; const rot = (r() * 360 + k * 500) % 360;
    h += `<div class="conf" style="left:${x}px;top:${y}px;width:${16 + r() * 12}px;height:${10 + r() * 8}px;background:${cols[i % cols.length]};border:2px solid ${INK};opacity:${c01((3 - k) / .5)};transform:rotate(${rot}deg) scaleY(${Math.cos(k * 9 + i)})"></div>`;
  }
  return h;
}

const XF = 0.45;
window.draw = (i, t) => {
  const cur = document.getElementById('cur'), prev = document.getElementById('prev');
  cur.innerHTML = S[i].draw(t);
  if (i > 0 && t < XF) {
    const p = ease(t / XF);
    prev.innerHTML = S[i - 1].draw(S[i - 1].dur);
    prev.style.transform = `translateX(${-p * 1150}px) rotate(${-p * 6}deg)`;
    cur.style.transform = `translateX(${(1 - p) * 1150}px) rotate(${(1 - p) * 6}deg)`;
  } else { prev.innerHTML = ''; cur.style.transform = 'none'; prev.style.transform = 'none'; }
  return Promise.all([...document.images].map(im => im.complete && im.naturalWidth ? 0 : im.decode().catch(() => 0)));
};
